name: Check (analyze + tests)

# Revisa el código en cualquier rama y en los pull requests ANTES de llegar a main,
# donde se publica la web y el APK.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

  # Motor de reglas nutricionales (TypeScript, se ejecutará en las funciones de Supabase)
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests del motor de reglas
        run: node --test supabase/functions/_shared/nutrition/engine.test.ts
